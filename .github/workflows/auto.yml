name: Digital Manipur Autonomous Crawler

on:
  schedule:
    - cron: '0 */2 * * *' # Runs automatically every 2 hours in the cloud
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests feedparser

      - name: Execute Live Crawler
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
